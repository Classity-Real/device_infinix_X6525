name: Build boot images (X6525)

# Builds only the images that live outside the dynamic partitions: boot,
# vendor_boot (which carries the Lineage recovery ramdisk), dtbo, vbmeta and
# super_empty. Useful while iterating on the kernel/boot flow, because it skips
# system/system_ext/vendor/product/odm/vendor_dlkm entirely.
#
# The recovery ramdisk is part of vendor_boot.img on this device
# (TARGET_NO_RECOVERY := true, BOARD_INCLUDE_RECOVERY_RAMDISK_IN_VENDOR_BOOT),
# so there is no recovery.img to build.
#
# Triggered manually: Actions -> "Build boot images (X6525)" -> Run workflow,
# or `gh workflow run boot.yml -R Classity-Real/device_infinix_X6525`.

on:
  workflow_dispatch:

concurrency:
  # Never cancel (or be cancelled by) the full ROM build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: namespace-profile-workshop
    timeout-minutes: 240

    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: lineage/device/infinix/X6525

      - name: Checkout vendor blobs
        uses: actions/checkout@v4
        with:
          repository: Classity-Real/vendor_infinix_X6525
          path: lineage/vendor/infinix/X6525

      - name: Set up ccache volume
        uses: namespacelabs/nscloud-cache-action@v1
        continue-on-error: true
        with:
          path: |
            /home/runner/.ccache

      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick libelf-dev liblz4-tool libncurses-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush \
            rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 \
            python-is-python3 || true
          sudo apt-get install -y --no-install-recommends \
            lib32ncurses-dev lib32readline-dev lib32z1-dev || true
          if ! sudo apt-get install -y --no-install-recommends \
                 libncurses5 libtinfo5; then
            base=http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses
            curl -fsSLo /tmp/libncurses5.deb "$base/libncurses5_6.2-0ubuntu2_amd64.deb"
            curl -fsSLo /tmp/libtinfo5.deb "$base/libtinfo5_6.2-0ubuntu2_amd64.deb"
            sudo dpkg -i /tmp/libtinfo5.deb /tmp/libncurses5.deb
          fi
          for t in git curl python3 unzip; do command -v "$t" >/dev/null || exit 1; done

      - name: Configure ccache
        run: |
          mkdir -p /home/runner/.ccache || sudo mkdir -p /home/runner/.ccache
          echo "CCACHE_DIR=/home/runner/.ccache" >> "$GITHUB_ENV"
          echo "USE_CCACHE=1" >> "$GITHUB_ENV"
          echo "CCACHE_EXEC=/usr/bin/ccache" >> "$GITHUB_ENV"
          echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"
          echo "CCACHE_COMPRESS=true" >> "$GITHUB_ENV"
          # The Namespace cache volume is 49G; leave headroom so the post-job
          # cache save is not skipped for exceeding the volume.
          ccache -M 20G || true

      - name: Install repo
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Repo init
        working-directory: lineage
        run: |
          git config --global user.name "LineageOS CI"
          git config --global user.email "ci@lineage.local"
          git config --global color.ui false
          repo init -u https://github.com/LineageOS/android.git -b lineage-20.0 --git-lfs --depth=1

      - name: Repo sync
        working-directory: lineage
        run: |
          repo sync -c -j"$(nproc)" --force-sync --no-clone-bundle --no-tags \
            || repo sync -c -j"$(nproc)" --force-sync --no-clone-bundle --no-tags
          df -h /

      - name: Build boot images
        working-directory: lineage
        run: |
          set -o pipefail
          source build/envsetup.sh
          lunch lineage_X6525-userdebug
          # bootimage/vendorbootimage/vbmetaimage/superimage_empty are phony
          # targets (build/make/core/main.mk); dtbo.img has no phony target, so
          # it is requested by its output path.
          mka \
            bootimage \
            vendorbootimage \
            vbmetaimage \
            superimage_empty \
            "out/target/product/X6525/dtbo.img"

      - name: Collect boot images
        if: always()
        run: |
          out=lineage/out/target/product/X6525
          mkdir -p artifacts
          for f in boot.img vendor_boot.img dtbo.img vbmeta.img super_empty.img; do
            [ -e "$out/$f" ] && cp "$out/$f" artifacts/ || true
          done
          ls -lh artifacts || true
          sha256sum artifacts/* 2>/dev/null || true

      - name: Upload boot images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: X6525-boot-${{ github.run_number }}
          path: artifacts/*
          if-no-files-found: warn
          retention-days: 14
