name: Build boot images (X6525)

# Builds only the images that live outside the dynamic partitions: boot,
# vendor_boot (which carries the Lineage recovery ramdisk fragment), dtbo and
# super_empty. Useful while iterating on the kernel/boot flow, because it skips
# system/system_ext/vendor/product/odm/vendor_dlkm entirely.
#
# vendor_boot.img carries two ramdisk fragments: the platform ramdisk
# (BOARD_MOVE_RECOVERY_RESOURCES_TO_VENDOR_BOOT plus
# BOARD_INCLUDE_RECOVERY_RAMDISK_IN_VENDOR_BOOT, which packs
# TARGET_RECOVERY_ROOT_OUT as a separate type=RECOVERY fragment). There is no
# recovery partition and no recovery.img; LK boots the RECOVERY fragment when
# misc/BCB asks for recovery, which is how the reference LineageOS build for
# this device ships LineageOS Recovery.
#
# Triggered manually: Actions -> "Build boot images (X6525)" -> Run workflow,
# or `gh workflow run boot.yml -R Classity-Real/device_infinix_X6525`.

on:
  workflow_dispatch:

concurrency:
  # Never cancel (or be cancelled by) the full ROM build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: namespace-profile-workshop
    timeout-minutes: 240

    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: lineage/device/infinix/X6525

      - name: Checkout vendor blobs
        uses: actions/checkout@v4
        with:
          repository: Classity-Real/vendor_infinix_X6525
          path: lineage/vendor/infinix/X6525

      - name: Set up ccache volume
        uses: namespacelabs/nscloud-cache-action@v1
        continue-on-error: true
        with:
          path: |
            /home/runner/.ccache

      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick libelf-dev liblz4-tool libncurses-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lz4 lzop pngcrush \
            rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 \
            python-is-python3 device-tree-compiler || true
          sudo apt-get install -y --no-install-recommends \
            lib32ncurses-dev lib32readline-dev lib32z1-dev || true
          if ! sudo apt-get install -y --no-install-recommends \
                 libncurses5 libtinfo5; then
            base=http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses
            curl -fsSLo /tmp/libncurses5.deb "$base/libncurses5_6.2-0ubuntu2_amd64.deb"
            curl -fsSLo /tmp/libtinfo5.deb "$base/libtinfo5_6.2-0ubuntu2_amd64.deb"
            sudo dpkg -i /tmp/libtinfo5.deb /tmp/libncurses5.deb
          fi
          for t in git curl python3 unzip; do command -v "$t" >/dev/null || exit 1; done

      - name: Configure ccache
        run: |
          mkdir -p /home/runner/.ccache || sudo mkdir -p /home/runner/.ccache
          echo "CCACHE_DIR=/home/runner/.ccache" >> "$GITHUB_ENV"
          echo "USE_CCACHE=1" >> "$GITHUB_ENV"
          echo "CCACHE_EXEC=/usr/bin/ccache" >> "$GITHUB_ENV"
          echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"
          echo "CCACHE_COMPRESS=true" >> "$GITHUB_ENV"
          # The Namespace cache volume is 49G; leave headroom so the post-job
          # cache save is not skipped for exceeding the volume.
          ccache -M 20G || true

      - name: Install repo
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Repo init
        working-directory: lineage
        run: |
          git config --global user.name "LineageOS CI"
          git config --global user.email "ci@lineage.local"
          git config --global color.ui false
          repo init -u https://github.com/LineageOS/android.git -b lineage-20.0 --git-lfs --depth=1

      - name: Repo sync
        working-directory: lineage
        run: |
          repo sync -c -j"$(nproc)" --force-sync --no-clone-bundle --no-tags \
            || repo sync -c -j"$(nproc)" --force-sync --no-clone-bundle --no-tags
          df -h /

      - name: Patch the DTB kernel command line
        run: |
          # LK builds the kernel command line from /chosen/bootargs of the DTB
          # in vendor_boot.img and then appends the vendor_boot header cmdline
          # (BOARD_KERNEL_CMDLINE); the saved last_kmsg on the device shows both
          # in one line. Patch the DTB only for the early loglevel, and leave
          # androidboot.selinux to the header cmdline as well.
          python3 lineage/device/infinix/X6525/tools/dtb_bootargs.py \
            lineage/device/infinix/X6525/prebuilts/dtb/dtb.dtb \
            --drop loglevel=1 \
            --add loglevel=7 \
            --add ignore_loglevel \
            --add androidboot.selinux=permissive

      - name: Build boot images
        working-directory: lineage
        run: |
          set -o pipefail
          source build/envsetup.sh
          lunch lineage_X6525-userdebug
          # bootimage/vendorbootimage/superimage_empty are phony targets
          # (build/make/core/main.mk); dtbo.img has no phony target, so it is
          # requested by its output path.
          mka \
            bootimage \
            vendorbootimage \
            superimage_empty \
            "out/target/product/X6525/dtbo.img"

      - name: Inspect recovery USB payload
        if: always()
        working-directory: lineage
        run: |
          out=out/target/product/X6525
          echo "=== init.recovery.*.rc in recovery/root ==="
          ls -l "$out"/recovery/root/init.recovery.*.rc 2>&1 || true
          echo "=== recovery/root usbdebug.sh ==="
          ls -l "$out"/recovery/root/system/etc/usbdebug.sh 2>&1 || true
          echo "=== recovery/root/prop.default usb props ==="
          grep -e 'recovery.usb' -e 'sys.usb' -e 'ro.debuggable=' \
            "$out"/recovery/root/prop.default 2>&1 || true
          echo "=== vendor_boot ramdisk fragments ==="
          img="$out/vendor_boot.img"
          python3 - "$img" <<'PYX' || true
          import os, struct, subprocess, sys, tempfile

          d = open(sys.argv[1], 'rb').read()
          if d[:8] != b'VNDRBOOT':
              print('not a vendor_boot image')
              raise SystemExit
          u32 = lambda o: struct.unpack_from('<I', d, o)[0]
          page, vrs, dtbsz = u32(12), u32(24), u32(2100)
          ents, esz = u32(2116), u32(2120)
          print('vendor cmdline:', d[28:2084].split(b'\0')[0].decode(errors='replace'))
          off = page + (vrs + page - 1) // page * page
          tbl = off + (dtbsz + page - 1) // page * page
          types = {1: 'PLATFORM', 2: 'RECOVERY'}
          for i in range(ents):
              e = tbl + i * esz
              sz, fo, typ = struct.unpack_from('<III', d, e)
              print('fragment %d: type=%s size=%d' % (i, types.get(typ, typ), sz))
              raw = d[page + fo:page + fo + sz]
              tmp = os.path.join(tempfile.mkdtemp(), 'f%d' % i)
              open(tmp + '.lz4', 'wb').write(raw)
              lz = subprocess.run(['lz4', '-dc', tmp + '.lz4'], capture_output=True)
              data = lz.stdout if lz.returncode == 0 else raw
              open(tmp, 'wb').write(data)
              names = subprocess.run(['cpio', '-it', '--quiet'], stdin=open(tmp, 'rb'),
                                     capture_output=True).stdout.decode(errors='replace').split()
              print('  entries: %d' % len(names))
              for n in sorted(names):
                  if (n.startswith('init.recovery.')
                          or n in ('system/etc/usbdebug.sh', 'system/bin/recovery',
                                   'first_stage_ramdisk/system/bin/e2fsck',
                                   'first_stage_ramdisk/system/bin/fsck.f2fs',
                                   'first_stage_ramdisk/system/bin/linker64',
                                   'first_stage_ramdisk/system/bin/snapuserd')):
                      print('   ', n)
          PYX

      - name: Collect boot images
        if: always()
        run: |
          out=lineage/out/target/product/X6525
          mkdir -p artifacts
          for f in boot.img vendor_boot.img dtbo.img super_empty.img; do
            [ -e "$out/$f" ] && cp "$out/$f" artifacts/ || true
          done
          ls -lh artifacts || true
          sha256sum artifacts/* 2>/dev/null || true

      - name: Upload boot images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: X6525-boot-${{ github.run_number }}
          path: artifacts/*
          if-no-files-found: warn
          retention-days: 14
