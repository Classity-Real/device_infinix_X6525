name: Build LineageOS 20 (X6525)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      # Workflow-only changes must not trigger a full ROM build.
      - '.github/workflows/**'

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: namespace-profile-workshop
    timeout-minutes: 720

    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: lineage/device/infinix/X6525

      - name: Checkout vendor blobs
        uses: actions/checkout@v4
        with:
          repository: Classity-Real/vendor_infinix_X6525
          path: lineage/vendor/infinix/X6525

      - name: Set up ccache volume
        uses: namespacelabs/nscloud-cache-action@v1
        continue-on-error: true
        with:
          path: |
            /home/runner/.ccache

      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick libelf-dev liblz4-tool libncurses-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lz4 lzop pngcrush \
            rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 \
            python-is-python3 device-tree-compiler || true
          # 32-bit libs are only needed for the legacy 32-bit tools; keep going
          # if this repository is unavailable on the runner image.
          sudo apt-get install -y --no-install-recommends \
            lib32ncurses-dev lib32readline-dev lib32z1-dev || true
          # The legacy clang used for the RenderScript bitcode
          # (prebuilts/clang/host/linux-x86/clang-3289846) links against ncurses 5,
          # which Ubuntu 24.04 (noble) no longer ships.
          if ! sudo apt-get install -y --no-install-recommends \
                 libncurses5 libtinfo5; then
            base=http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses
            curl -fsSLo /tmp/libncurses5.deb "$base/libncurses5_6.2-0ubuntu2_amd64.deb"
            curl -fsSLo /tmp/libtinfo5.deb "$base/libtinfo5_6.2-0ubuntu2_amd64.deb"
            sudo dpkg -i /tmp/libtinfo5.deb /tmp/libncurses5.deb
          fi
          for t in git curl python3 unzip; do command -v "$t" >/dev/null || exit 1; done

      - name: Set up swap
        continue-on-error: true
        run: |
          # Namespace runners are containers and may forbid swapon; the build
          # still has 32 GB of RAM, so this is only a safety net.
          if sudo fallocate -l 32G /swapfile && sudo chmod 600 /swapfile \
             && sudo mkswap /swapfile && sudo swapon /swapfile; then
            echo "swap enabled"
          else
            echo "swap not available on this runner, continuing without it"
            sudo rm -f /swapfile || true
          fi
          free -h

      - name: Configure ccache
        run: |
          mkdir -p /home/runner/.ccache || sudo mkdir -p /home/runner/.ccache
          echo "CCACHE_DIR=/home/runner/.ccache" >> "$GITHUB_ENV"
          echo "USE_CCACHE=1" >> "$GITHUB_ENV"
          echo "CCACHE_EXEC=/usr/bin/ccache" >> "$GITHUB_ENV"
          echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"
          echo "CCACHE_COMPRESS=true" >> "$GITHUB_ENV"
          # The Namespace cache volume is 49G. A 50G ccache fills it up, which
          # makes the post-job cache save exceed the volume (and the action
          # never persists anything). 20G leaves headroom and compresses well.
          ccache -M 20G || true
          ccache -s || true

      - name: Install repo
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Repo init
        working-directory: lineage
        run: |
          git config --global user.name "LineageOS CI"
          git config --global user.email "ci@lineage.local"
          git config --global color.ui false
          repo init -u https://github.com/LineageOS/android.git -b lineage-20.0 --git-lfs --depth=1

      - name: Repo sync
        working-directory: lineage
        run: |
          repo sync -c -j"$(nproc)" --force-sync --no-clone-bundle --no-tags \
            || repo sync -c -j"$(nproc)" --force-sync --no-clone-bundle --no-tags
          df -h /

      - name: Patch the DTB kernel command line
        run: |
          # LK builds the kernel command line from /chosen/bootargs of the DTB
          # in vendor_boot.img and then appends the vendor_boot header cmdline
          # (BOARD_KERNEL_CMDLINE). The saved last_kmsg on the device shows both
          # in one line, so BOARD_KERNEL_CMDLINE is effective; the DTB is still
          # patched because it is the only place that can raise loglevel before
          # init starts.
          #
          # loglevel=1 (stock) hides every init message from the console, and
          # the only capture channel the X6525 gives us after a failed boot is
          # ramoops/pstore, which stores console output. Raise the level and
          # force every printk to the console so init's LOG(FATAL) reason is
          # recorded.
          python3 lineage/device/infinix/X6525/tools/dtb_bootargs.py \
            lineage/device/infinix/X6525/prebuilts/dtb/dtb.dtb \
            --drop loglevel=1 \
            --add loglevel=7 \
            --add ignore_loglevel \
            --add androidboot.selinux=permissive

      - name: Build
        working-directory: lineage
        run: |
          set -o pipefail
          source build/envsetup.sh
          lunch lineage_X6525-userdebug
          # vendorbootimage is an explicit goal because `bacon` builds
          # vendor_boot.img only inside the target-files package, not into
          # out/target/product/X6525.
          mka bacon vendorbootimage -j"$(nproc)"

      # Check the final image, not the staging directories, and never fail the
      # build here. vendor_boot has two ramdisk fragments: the platform ramdisk
      # (first-stage fstab, modules, fsck toolset, snapuserd) and the RECOVERY
      # ramdisk (lineage recovery root).
      - name: Inspect the built vendor_boot image
        if: always()
        working-directory: lineage
        run: |
          img=out/target/product/X6525/vendor_boot.img
          ls -l "$img" 2>&1 || exit 0
          python3 - "$img" <<'PYX' || true
          import os, re, shutil, struct, subprocess, sys, tempfile

          # This job does not need the Android build's host tools, but the
          # ramdisk listing needs lz4 + cpio from the distro. Fail loudly and
          # with a hint instead of a bare traceback: the step is `|| true`, so a
          # silent exception would look like a shorter fragment listing.
          for tool in ('lz4', 'cpio'):
              if not shutil.which(tool):
                  print('::warning::%s is not installed; cannot list ramdisk entries' % tool)
                  raise SystemExit(0)

          d = open(sys.argv[1], 'rb').read()
          if d[:8] != b'VNDRBOOT':
              print('not a vendor_boot image')
              raise SystemExit
          u32 = lambda o: struct.unpack_from('<I', d, o)[0]
          page, vrs, dtbsz = u32(12), u32(24), u32(2100)
          ents, esz = u32(2116), u32(2120)
          print('vendor cmdline:', d[28:2084].split(b'\0')[0].decode(errors='replace'))
          off = page + (vrs + page - 1) // page * page
          print('dtb bootargs:')
          for s in re.findall(rb'[ -~]{20,}', d[off:off + dtbsz]):
              t = s.decode()
              if 'androidboot' in t or t.startswith('earlycon'):
                  print('   ', t)
          tbl = off + (dtbsz + page - 1) // page * page
          print('fragments:', ents)
          types = {1: 'PLATFORM', 2: 'RECOVERY'}
          frags = {}
          for i in range(ents):
              e = tbl + i * esz
              sz, fo, typ = struct.unpack_from('<III', d, e)
              name = d[e + 12:e + 44].split(b'\0')[0].decode(errors='replace')
              print('  [%d] type=%s name=%r size=%d'
                    % (i, types.get(typ, typ), name, sz))
              raw = d[page + fo:page + fo + sz]
              tmp = os.path.join(tempfile.mkdtemp(), 'f%d' % i)
              open(tmp + '.lz4', 'wb').write(raw)
              lz = subprocess.run(['lz4', '-dc', tmp + '.lz4'], capture_output=True)
              open(tmp, 'wb').write(lz.stdout if lz.returncode == 0 else raw)
              names = subprocess.run(['cpio', '-it', '--quiet'], stdin=open(tmp, 'rb'),
                                     capture_output=True).stdout.decode(errors='replace').split()
              frags[typ] = names
              print('       entries: %d' % len(names))
          plat = set(frags.get(1, []))
          rec = set(frags.get(2, []))
          print('platform ramdisk:')
          for req in ('first_stage_ramdisk/fstab.X6525',
                      'first_stage_ramdisk/system/bin/linker64',
                      'first_stage_ramdisk/system/bin/e2fsck',
                      'first_stage_ramdisk/system/bin/fsck.f2fs',
                      'first_stage_ramdisk/system/bin/snapuserd',
                      'lib/modules/modules.load',
                      'lib/modules/modules.load.recovery',
                      'lib/modules/ufs-sprd_qogirl6.ko'):
              print('   %-52s %s' % (req, 'ok' if req in plat else 'MISSING'))
          print('recovery ramdisk:')
          for req in ('init.recovery.X6525.rc', 'system/bin/recovery',
                      'system/etc/recovery.fstab', 'first_stage_ramdisk/fstab.X6525'):
              print('   %-52s %s' % (req, 'ok' if req in rec else 'MISSING'))
          PYX
      - name: Collect images
        if: always()
        run: |
          out=lineage/out/target/product/X6525
          mkdir -p artifacts
          # The globs must be prefixed with $out: an unquoted wildcard is
          # expanded relative to the current directory, not to $out.
          shopt -s nullglob
          for f in "$out"/lineage-20.0-*.zip \
                   "$out"/boot.img \
                   "$out"/vendor_boot.img \
                   "$out"/dtbo.img \
                   "$out"/super_empty.img; do
            [ -e "$f" ] && cp -v "$f" artifacts/ || true
          done
          if [ ! -e artifacts/vendor_boot.img ]; then
            cp -v "$out"/obj/PACKAGING/target_files_intermediates/*/IMAGES/vendor_boot.img \
              artifacts/ || true
          fi
          ls -lh artifacts || true
          sha256sum artifacts/* 2>/dev/null || true

      # Raw images of the dynamic partitions, for installing the ROM without a
      # working recovery USB: the OTA zip carries a payload.bin, which only
      # update_engine (i.e. `adb sideload`) can apply - the bootloader's fastboot
      # cannot flash logical partitions and TWRP cannot apply an A/B payload.
      # These images are written straight to /dev/block/mapper/{system,...} by
      # TWRP's Install Image (or by fastboot, if the bootloader answers
      # `getvar is-logical:<name>`).
      - name: Collect system images
        if: always()
        run: |
          out=lineage/out/target/product/X6525
          imgs=lineage/out/target/product/X6525/obj/PACKAGING/target_files_intermediates/*/IMAGES
          mkdir -p system-images
          for p in system system_ext product vendor odm vendor_dlkm; do
            if [ -f "$out/$p.img" ]; then
              cp -v "$out/$p.img" system-images/
            else
              for f in $imgs/"$p.img"; do
                [ -f "$f" ] && cp -v "$f" system-images/
              done
            fi
          done
          {
            echo 'Raw images of the dynamic (super) partitions, built with erofs and an AVB'
            echo 'hash footer. Install with TWRP -> Install -> Install Image -> pick the file ->'
            echo 'select the matching partition, in this order:'
            echo
            echo '  system.img       -> System Image'
            echo '  system_ext.img   -> System Ext Image'
            echo '  product.img      -> Product Image'
            echo '  vendor.img       -> Vendor Image'
            echo '  odm.img          -> ODM Image'
            echo '  vendor_dlkm.img  -> Vendor Dlkm Image'
            echo
            echo 'Do not install boot.img / vendor_boot.img / dtbo.img this way; use'
            echo 'fastboot flash boot|vendor_boot|dtbo from the bootloader for those.'
            echo
            echo 'The images are content-sized and smaller than the on-device logical'
            echo 'partitions, so they fit without touching the super metadata. TWRP must'
            echo 'have mapped the logical partitions; if Install Image does not list them,'
            echo 'write the image with:'
            echo
            echo '  dd if=system.img of=/dev/block/mapper/system bs=1M'
          } > system-images/README.txt
          ls -lh system-images || true
          sha256sum system-images/*.img 2>/dev/null || true

      - name: Upload system images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-images-X6525-${{ github.run_number }}
          path: system-images/*
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lineage-20.0-X6525-${{ github.run_number }}
          path: artifacts/*
          if-no-files-found: warn
          retention-days: 14

      # The three images outside the dynamic partitions, as a separate small
      # artifact: iterating on the boot flow should not require downloading the
      # 1.6 GB ROM zip. Keep the name distinct from lineage-* because
      # publish-artifact.yml mirrors the ROM artifact by that prefix.
      - name: Upload boot images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-images-X6525-${{ github.run_number }}
          path: |
            artifacts/boot.img
            artifacts/vendor_boot.img
            artifacts/dtbo.img
            artifacts/super_empty.img
          if-no-files-found: warn
          retention-days: 14
